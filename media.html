<!doctype html>
<!-- Flux Anime: the Yomi anime library, laid out exactly like Flux TV. Same look,
     but the catalogue is library.json sitting next to this page and playback runs
     through the provider embeds yomi.to computes client-side (no TMDB, no 2Embed).
     Works two ways: dropped into the Flux folder and opened by the shell like
     media.html, or served standalone from this folder with python -m http.server. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Flux Anime</title>
		<style>
			/* Fonts: same self-hosted files Flux ships (fonts/ next to this page). */
			@font-face {
				font-family: "Geist";
				font-weight: 100 900;
				font-display: swap;
				src: url(fonts/geist.woff2) format("woff2");
			}
			@font-face {
				font-family: "Manrope";
				font-weight: 200 800;
				font-display: swap;
				src: url(fonts/manrope.woff2) format("woff2");
			}

			/* ── Flux tokens (css/style.css) ─────────────────────────────── */
			html {
				--bg: #000;
				--bg2: #16161b;
				--fg: #f5f6f8;
				--fg-m: #9a9aa2;
				--fg-d: #6b6b73;
				--a: 255, 255, 255;
				--on-accent: #000;
				--m1: 96, 40, 200;
				--m2: 30, 60, 160;
				--accent: rgb(var(--a));
				--surface: color-mix(in srgb, var(--bg2) 80%, transparent);
				--surface-2: color-mix(in srgb, color-mix(in srgb, var(--bg2), var(--fg) 5%) 80%, transparent);
				--surface-3: color-mix(in srgb, color-mix(in srgb, var(--bg2), var(--fg) 10%) 80%, transparent);
				--field: #1e1e24;
				--field-hover: #24242b;
				--border: color-mix(in srgb, var(--accent) 12%, color-mix(in srgb, color-mix(in srgb, var(--bg2), var(--fg) 9%) 85%, transparent));
				--border-2: color-mix(in srgb, var(--accent) 18%, color-mix(in srgb, color-mix(in srgb, var(--bg2), var(--fg) 16%) 85%, transparent));
				--shade: rgba(0, 0, 0, 0.55);
				--r-xs: 2px;
				--r-sm: 4px;
				--r: 6px;
				--ease: cubic-bezier(0.16, 1, 0.3, 1);
				--t-hover: 0.3s ease;
				color-scheme: dark;
			}
			/* Text boxes ease in slowly on hover/focus so they feel smooth, not snappy. */
			html {
				--t-field: border-color 0.35s var(--ease), background-color 0.35s var(--ease), box-shadow 0.45s var(--ease), color 0.35s var(--ease);
				--ring: none; /* focus is a plain border (--focus), no glow */
				--focus: color-mix(in srgb, var(--fg) 38%, transparent);
			}

			/* ── Flux base + shared controls (css/style.css) ─────────────── */
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
			}
			html {
				isolation: isolate;
				background: transparent;
				color: var(--fg);
				font: 14px/1.5 "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			[hidden] {
				display: none !important;
			}
			button,
			input,
			select {
				font: inherit;
				color: inherit;
			}
			button {
				cursor: pointer;
			}
			:focus-visible {
				outline: 1px solid var(--accent);
				outline-offset: 1px;
			}
			.i {
				width: 16px;
				height: 16px;
				flex: none;
				fill: none;
				stroke: currentColor;
				stroke-width: 1.75;
				stroke-linecap: round;
				stroke-linejoin: round;
			}
			@keyframes rise {
				from { opacity: 0; transform: translate3d(0, 10px, 0); }
			}
			.field {
				display: flex;
				align-items: center;
				gap: 0.6rem;
				height: 36px;
				padding: 0 0.8rem;
				border: 1px solid var(--border);
				border-radius: var(--r-sm);
				background: var(--surface);
				color: var(--fg-m);
				transition: var(--t-field);
			}
			.field:hover {
				border-color: var(--border-2);
			}
			.field:focus-within {
				border-color: var(--focus);
				background-color: var(--field-hover);
				box-shadow: var(--ring);
				color: var(--fg);
			}
			.field .i {
				transition: transform 0.45s var(--ease);
			}
			.field:focus-within .i {
				transform: scale(1.1);
			}
			input::placeholder {
				transition: opacity 0.35s var(--ease);
			}
			input:focus::placeholder {
				opacity: 0.45;
			}
			.field input {
				flex: 1;
				min-width: 0;
				height: 100%;
				border: 0;
				outline: 0;
				background: transparent;
				color: var(--fg);
			}
			.field input::placeholder {
				color: var(--fg-d);
			}
			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				height: 34px;
				padding: 0 0.95rem;
				border: 1px solid var(--border);
				border-radius: var(--r-sm);
				background: var(--surface);
				color: var(--fg-m);
				font-size: 13px;
				font-weight: 500;
				white-space: nowrap;
				transition: background-color var(--t-hover), border-color var(--t-hover), color var(--t-hover), transform 0.15s var(--ease);
			}
			.btn:hover {
				border-color: var(--border-2);
				background: var(--surface-2);
				color: var(--fg);
			}
			.btn:active {
				transform: scale(0.96);
			}
			.btn[aria-pressed="true"],
			.btn.primary {
				border-color: var(--accent);
				background: var(--accent);
				color: var(--on-accent, #fff);
			}
			.btn.primary:hover,
			.btn[aria-pressed="true"]:hover {
				filter: brightness(0.92);
			}
			.btn[aria-pressed="true"] .i {
				fill: currentColor;
			}
			.page-title {
				margin: 0 0 14px;
				font-family: "Manrope", "Geist", sans-serif;
				font-size: 22px;
				font-weight: 600;
			}

			/* ── Flux TV page styles (media.html) ────────────────────────── */
			/* The page draws no background of its own: it stays fully transparent so
			   whatever sits behind it — the Flux shell's backdrop — shows through. */
			html,
			body {
				height: auto;
				background: transparent;
			}
			body {
				display: block;
				padding: 0;
				overflow: auto;
			}
			main {
				max-width: 1280px;
				margin: 0 auto;
				padding: 0 22px 40px;
			}
			.tv-bar {
				display: flex;
				align-items: center;
				gap: 12px;
				max-width: 1280px;
				margin: 0 auto;
				padding: 20px 22px 16px;
			}
			.tv-tabs {
				display: flex;
				gap: 2px;
			}
			.tv-tab {
				padding: 7px 12px;
				border: 0;
				border-radius: var(--r-sm);
				background: transparent;
				color: var(--fg-m);
				font-size: 13px;
				font-weight: 500;
				transition: background-color var(--t-hover), color var(--t-hover);
			}
			.tv-tab:hover,
			.tv-tab[aria-current] {
				background: var(--surface-2);
				color: var(--fg);
			}
			.tv-search {
				position: relative;
				flex: 1;
				max-width: 420px;
				margin-left: auto;
			}
			.tv-results {
				position: absolute;
				top: calc(100% + 6px);
				left: 0;
				right: 0;
				z-index: 20;
				max-height: 380px;
				padding: 4px;
				overflow: auto;
				border: 1px solid var(--border);
				border-radius: var(--r);
				background: var(--field);
				box-shadow: 0 18px 40px -14px rgba(0, 0, 0, 0.7);
				animation: rise 0.25s var(--ease) both;
			}
			.tv-result {
				display: flex;
				align-items: center;
				gap: 10px;
				width: 100%;
				padding: 6px 8px;
				border: 0;
				border-radius: var(--r-sm);
				background: transparent;
				text-align: left;
				transition: background-color var(--t-hover);
			}
			.tv-result:hover {
				background: var(--surface-2);
			}
			.tv-result img {
				width: 34px;
				height: 51px;
				flex: none;
				border-radius: var(--r-xs);
				object-fit: cover;
				background: var(--surface-2);
			}
			.tv-result b {
				display: block;
				font-size: 13px;
				font-weight: 500;
			}
			.tv-empty {
				padding: 14px;
				color: var(--fg-m);
				font-size: 13px;
				text-align: center;
			}
			.tv-row-title {
				margin: 28px 0 12px;
				font-family: "Manrope", "Geist", sans-serif;
				font-size: 16px;
				font-weight: 600;
			}
			/* Hero: the top-rated title. */
			.tv-hero {
				position: relative;
				display: flex;
				align-items: flex-end;
				min-height: 320px;
				overflow: hidden;
				border: 1px solid var(--border);
				border-radius: var(--r);
				background: var(--surface-2) center / cover no-repeat;
			}
			.tv-hero::before {
				content: "";
				position: absolute;
				inset: 0;
				background: linear-gradient(90deg, rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0.35) 60%, transparent);
			}
			.tv-hero-body {
				position: relative;
				max-width: 520px;
				padding: 26px;
			}
			.tv-hero h1 {
				margin: 6px 0 8px;
				font-family: "Manrope", "Geist", sans-serif;
				font-size: 24px;
				font-weight: 700;
				line-height: 1.2;
			}
			.tv-hero p,
			.tv-overview {
				margin: 0 0 16px;
				color: #c4c4cc;
				font-size: 13.5px;
				line-height: 1.6;
			}
			.tv-actions {
				display: flex;
				gap: 8px;
			}
			.tv-tags {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}
			.tv-tag {
				padding: 2px 8px;
				border: 1px solid var(--border);
				border-radius: var(--r-xs);
				color: var(--fg-m);
				font-size: 11.5px;
			}
			/* Poster grid */
			.tv-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
				gap: 14px;
			}
			.tv-card {
				display: flex;
				flex-direction: column;
				gap: 6px;
				padding: 0;
				border: 0;
				background: none;
				text-align: left;
				content-visibility: auto;
				contain-intrinsic-size: auto 260px;
			}
			.tv-poster {
				display: block;
				width: 100%;
				aspect-ratio: 2 / 3;
				overflow: hidden;
				border: 1px solid var(--border);
				border-radius: var(--r);
				background: var(--surface-2);
				transition: border-color var(--t-hover);
			}
			.tv-poster img {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: cover;
			}
			.tv-card:hover .tv-poster,
			.tv-card:focus-visible .tv-poster {
				border-color: var(--focus);
			}
			.tv-card-title {
				overflow: hidden;
				font-size: 13px;
				font-weight: 500;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.tv-card small,
			.tv-result small {
				color: var(--fg-d);
				font-size: 11.5px;
			}
			.tv-chips {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				margin-bottom: 16px;
			}
			.tv-chip {
				padding: 5px 12px;
				border: 1px solid var(--border);
				border-radius: 999px;
				background: transparent;
				color: var(--fg-m);
				font-size: 12.5px;
				transition: border-color var(--t-hover), background-color var(--t-hover), color var(--t-hover);
			}
			.tv-chip:hover {
				border-color: var(--border-2);
				color: var(--fg);
			}
			.tv-chip[aria-pressed="true"] {
				border-color: var(--accent);
				background: var(--accent);
				color: var(--on-accent);
			}
			.tv-more {
				height: 1px;
			}
			.tv-loading {
				padding: 30px 0;
				color: var(--fg-m);
				font-size: 13px;
				text-align: center;
			}
			/* Info page */
			.tv-info-head {
				display: flex;
				gap: 22px;
				align-items: flex-end;
				min-height: 300px;
				padding: 24px;
				border: 1px solid var(--border);
				border-radius: var(--r);
				background: var(--surface-2) top center / cover no-repeat;
				position: relative;
				overflow: hidden;
			}
			.tv-info-head::before {
				content: "";
				position: absolute;
				inset: 0;
				background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
			}
			.tv-info-head > * {
				position: relative;
			}
			.tv-info-head img {
				width: 130px;
				aspect-ratio: 2 / 3;
				flex: none;
				border: 1px solid var(--border);
				border-radius: var(--r);
				object-fit: cover;
			}
			.tv-info-head h1 {
				margin: 0 0 8px;
				font-family: "Manrope", "Geist", sans-serif;
				font-size: 24px;
				font-weight: 700;
				line-height: 1.2;
			}
			.tv-info-head .tv-actions {
				margin-top: 14px;
			}
			.tv-facts {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
				gap: 14px;
				margin-top: 18px;
			}
			.tv-facts small {
				display: block;
				color: var(--fg-d);
				font-size: 11px;
				letter-spacing: 0.04em;
				text-transform: uppercase;
			}
			.tv-eps {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
				gap: 8px;
			}
			.tv-eps .btn[aria-pressed="true"] {
				border-color: var(--accent);
				background: var(--accent);
				color: var(--on-accent);
			}
			/* Player */
			.tv-watch-bar {
				display: flex;
				align-items: center;
				gap: 12px;
				margin-bottom: 12px;
			}
			.tv-watch-bar h1 {
				margin: 0;
				font-size: 15px;
				font-weight: 600;
			}
			.tv-player {
				position: relative;
				aspect-ratio: 16 / 9;
				overflow: hidden;
				border: 1px solid var(--border);
				border-radius: var(--r);
				background: #000;
			}
			.tv-player iframe {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				border: 0;
			}
			.tv-page:not([hidden]) {
				animation: rise 0.4s var(--ease) both;
			}
			@media (max-width: 760px) {
				.tv-bar {
					flex-wrap: wrap;
					padding: 14px 14px 10px 56px;
				}
				.tv-search {
					max-width: none;
					flex-basis: 100%;
				}
				main {
					padding: 0 14px 30px;
				}
				.tv-grid {
					grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
					gap: 10px;
				}
				.tv-info-head {
					flex-direction: column;
					align-items: flex-start;
				}
			}
		</style>
	</head>
	<body>
		<svg width="0" height="0" style="position: absolute" aria-hidden="true">
			<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></symbol>
			<symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3v18l15-9z" /></symbol>
			<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4M12 8h.01" /></symbol>
			<symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7M19 12H5" /></symbol>
		</svg>

		<header class="tv-bar">
			<nav class="tv-tabs" id="tabs">
				<button class="tv-tab" type="button" data-section="home" aria-current="true">Home</button>
				<button class="tv-tab" type="button" data-section="tv">TV</button>
				<button class="tv-tab" type="button" data-section="movie">Movies</button>
				<button class="tv-tab" type="button" data-section="all">Browse</button>
			</nav>
			<label class="field tv-search">
				<svg class="i"><use href="#i-search" /></svg>
				<input id="search" type="search" placeholder="Search your anime" aria-label="Search" autocomplete="off" spellcheck="false" />
				<div class="tv-results" id="results" hidden></div>
			</label>
		</header>

		<main>
			<section class="tv-page" id="page-home">
				<div class="tv-hero" id="hero"><div class="tv-hero-body"><p class="tv-loading">Loading…</p></div></div>
				<h2 class="tv-row-title">Currently airing</h2>
				<div class="tv-grid" id="home-airing"></div>
				<h2 class="tv-row-title">Highest rated</h2>
				<div class="tv-grid" id="home-top"></div>
				<h2 class="tv-row-title">Longest runs</h2>
				<div class="tv-grid" id="home-long"></div>
			</section>

			<section class="tv-page" id="page-browse" hidden>
				<h1 class="page-title" id="browse-title"></h1>
				<div class="tv-chips" id="format-chips" hidden></div>
				<div class="tv-chips" id="chips"></div>
				<div class="tv-grid" id="browse-grid"></div>
				<div class="tv-more" id="more"></div>
			</section>

			<section class="tv-page" id="page-info" hidden>
				<div class="tv-watch-bar"><button class="btn" type="button" data-back><svg class="i"><use href="#i-back" /></svg>Back</button></div>
				<div class="tv-info-head" id="info-head"></div>
				<div class="tv-facts" id="info-facts"></div>
				<div id="info-eps"></div>
			</section>

			<section class="tv-page" id="page-watch" hidden>
				<div class="tv-watch-bar">
					<button class="btn" type="button" data-back><svg class="i"><use href="#i-back" /></svg>Back</button>
					<div>
						<h1 id="watch-title"></h1>
						<small id="watch-ep"></small>
					</div>
				</div>
				<!-- Not sandboxed: the provider embeds refuse to play in a sandbox.
				     referrerpolicy like the yomi player: embeds ask for no foreign referer. -->
				<div class="tv-player"><iframe id="player" title="Player" referrerpolicy="no-referrer" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
				<div id="watch-servers"></div>
				<div id="watch-eps"></div>
			</section>
		</main>

		<script>
			const $ = (id) => document.getElementById(id);
			const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
			const icon = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;

			/* Provider table — transcribed from yomi.to's WatchLoader chunk (see src/config.js
			 * for the annotated original). yomi.to hosts no video; it computes these embed
			 * URLs client-side, and so do we: a pure function of (anilist_id, mal_id, episode).
			 *
			 * MegaPlay (server 1) is deliberately absent: its embed only answers requests
			 * that carry its own referer, which this page can never send — every MegaPlay
			 * button dead-ends in the provider's error screen regardless of language.
			 * The five remaining providers all answer a plain page. */
			const SERVER_LABELS = { 2: "AniLink", 3: "TryEmbed", 4: "Cinextream", 5: "Nontongo", 6: "4Animo" };
			const SERVER_ORDER = [3, 2, 4, 6, 5];
			const DUB_CAPABLE = { 2: 1, 3: 1, 4: 1, 6: 1 };
			const YOMI = "https://yomi.to";

			function slugify(title) {
				return title
					.normalize("NFKD")
					.replace(/[\u0300-\u036f]/g, "")
					.toLowerCase()
					.replace(/[^a-z0-9]+/g, "-")
					.replace(/^-+|-+$/g, "")
					.slice(0, 60)
					.replace(/-+$/g, "") || "anime";
			}
			function embedUrl(server, ani, mal, ep, lang) {
				switch (Number(server)) {
					case 1:
						return mal ? `https://megaplay.buzz/stream/mal/${mal}/${ep}/${lang}` : `https://megaplay.buzz/stream/ani/${ani}/${ep}/${lang}`;
					case 2:
						return `https://anilink.cc/watch/${ani}/${ep}?variant=${lang}&autoplay=1`;
					case 3:
						return `https://tryembed.us.cc/embed/anime/${ani}/${ep}/${lang}`;
					case 4:
						return `https://cinextream.cc/api/embed/anime/${lang}/${ani}/${ep}?color=7c6ee0`;
					case 5:
						return `https://nontongo.win/anime/${ani}/${ep}/play`;
					case 6:
						return `https://cdn.4animo.xyz/embed/ani/${ani}/${ep}/${lang}`;
					default:
						return null;
				}
			}
			function buildServersFor(ani, mal, ep) {
				const out = [];
				for (const sid of SERVER_ORDER) {
					const langs = DUB_CAPABLE[sid] ? ["sub", "dub"] : ["sub"];
					for (const lang of langs) {
						const url = embedUrl(sid, ani, mal, ep, lang);
						if (!url) continue;
						out.push({ name: SERVER_LABELS[sid], url, type: "iframe", language: lang, serverId: sid, requiresReferer: false, status: "unknown" });
					}
				}
				return out;
			}
			function expandEpisodes(a) {
				// Episode lists are omitted from library.json (it would weigh ~2 GB); rebuild
				// this title's list on open, the same way the local server does.
				if (a.episodes.length || !a.total_episodes || !a.anilist_id || !a.slug) return;
				for (let n = 1; n <= a.total_episodes; n++) {
					a.episodes.push({
						number: String(n),
						title: `Episode ${n}`,
						url: `${YOMI}/watch/${a.slug}-${a.anilist_id}/${n}`,
						servers: buildServersFor(a.anilist_id, a.mal_id, n).map((s) => ({ ...s })),
						error: null,
					});
				}
			}

			/* ── library ─────────────────────────────────────────────────── */
			const str = (v) => (v == null ? "" : String(v));
			function normServer(s, i) {
				if (typeof s === "string") s = { url: s };
				s = s || {};
				const url = str(s.url || s.src || s.file || s.link || "");
				let st = str(s.status || "");
				if (st !== "exists" && st !== "missing") st = "unknown";
				return {
					name: str(s.name || s.server || `Server ${i + 1}`),
					url,
					type: str(s.type).toLowerCase() === "direct" || /\.(m3u8|mp4|webm)(\?|$)/i.test(url) ? "direct" : "iframe",
					language: (str(s.language || s.quality) || "sub").toLowerCase(),
					serverId: s.server_id || 0,
					requiresReferer: !!s.requires_referer,
					status: st,
				};
			}
			function normEp(e, i) {
				e = e || {};
				let raw = e.servers || e.sources || e.links || [];
				if (!Array.isArray(raw)) raw = [];
				const n = str(e.number || e.episode || e.ep || i + 1);
				return {
					number: n,
					title: str(e.title || `Episode ${n}`),
					url: str(e.url || ""),
					// MegaPlay (server 1) is dropped wherever it survived in stored scan data.
					servers: raw.map(normServer).filter((s) => s.url && s.serverId !== 1),
					error: str(e.error || ""),
				};
			}
			function normAnime(a, i) {
				a = a || {};
				let raw = a.episodes || a.eps || [];
				if (!Array.isArray(raw)) raw = [];
				const title = str(a.title || a.name || `Untitled ${i + 1}`);
				const anilistId = a.anilist_id || null;
				return {
					title,
					image: str(a.image || a.poster || a.cover || ""),
					banner: str(a.banner || a.bannerImage || ""),
					synopsis: str(a.synopsis || a.description || ""),
					genres: Array.isArray(a.genres) ? a.genres.map(str) : [],
					status: str(a.status || ""),
					type: str(a.type || ""),
					year: str(a.year || ""),
					score: a.score || null,
					anilist_id: anilistId,
					mal_id: a.mal_id || null,
					total_episodes: a.total_episodes != null ? a.total_episodes : raw.length,
					slug: anilistId ? slugify(title) : "",
					episodes: raw.map(normEp),
				};
			}

			let LIB = [];
			const BY_ID = new Map(); // anilist_id -> entry
			async function boot() {
				try {
					const res = await fetch("library.json", { cache: "no-store" });
					if (!res.ok) throw new Error(`HTTP ${res.status}`);
					const j = await res.json();
					if (!Array.isArray(j.anime) || !j.anime.length) throw new Error("no anime array");
					LIB = j.anime.map(normAnime);
					for (const a of LIB) if (a.anilist_id && !BY_ID.has(a.anilist_id)) BY_ID.set(a.anilist_id, a);
					loadHome();
				} catch (err) {
					$("hero").innerHTML = `<div class="tv-hero-body"><p class="tv-loading">Couldn't load the library (${esc(err.message)}). Serve this folder with python -m http.server and reload.</p></div>`;
				}
			}

			/* Ads in the player like to open pop-ups; drop them. */
			window.open = () => null;

			/* Pages --------------------------------------------------------------- */
			let page = "home";
			let backTo = "home";
			let nav = 0; // bumped on every page change, so slow loads can tell they've been left
			function show(name) {
				nav++;
				if (page === "watch" && name !== "watch") $("player").src = "about:blank"; // stop playback
				for (const p of document.querySelectorAll(".tv-page")) p.hidden = p.id !== `page-${name}`;
				if (name === "home" || name === "browse") backTo = name;
				page = name;
				scrollTo(0, 0);
			}
			document.addEventListener("click", (e) => {
				if (e.target.closest("[data-back]")) show(page === "watch" && current?.fromInfo ? "info" : backTo);
			});

			const fmtName = (t) => ({ MOVIE: "Movie", TV: "TV", TV_SHORT: "Short", OVA: "OVA", ONA: "ONA", SPECIAL: "Special", MUSIC: "Music" }[t] || t || "Anime");
			const statusLabel = (s) => {
				s = (s || "").toLowerCase().replace(/_/g, " ");
				return s ? s[0].toUpperCase() + s.slice(1) : "";
			};
			const card = (a) =>
				`<button class="tv-card" type="button" data-id="${a.anilist_id}"><span class="tv-poster"><img src="${esc(a.image)}" alt="" loading="lazy" decoding="async"></span>` +
				`<span class="tv-card-title">${esc(a.title)}</span><small>${esc(fmtName(a.type))}${a.year ? ` · ${esc(a.year)}` : ""}</small></button>`;
			const cards = (list) => list.filter((a) => a.image && a.anilist_id).map(card).join("");

			document.addEventListener("click", (e) => {
				const c = e.target.closest(".tv-card, .tv-result");
				if (c) {
					$("results").hidden = true;
					openInfo(Number(c.dataset.id));
				}
			});

			/* Home ---------------------------------------------------------------- */
			function loadHome() {
				const byScore = LIB.filter((a) => a.anilist_id && a.image).slice().sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
				// Hero = the highest-rated title with a banner (same idea as Flux's #1 trending).
				const hero = byScore.find((a) => a.banner) || byScore[0];
				if (hero) {
					$("hero").style.backgroundImage = hero.banner ? `url("${esc(hero.banner)}")` : "";
					const syn = hero.synopsis;
					const total = hero.total_episodes || hero.episodes.length;
					$("hero").innerHTML =
						`<div class="tv-hero-body"><div class="tv-tags"><span class="tv-tag">#1 highest rated</span><span class="tv-tag">${esc(fmtName(hero.type))}</span>` +
						`${hero.score ? `<span class="tv-tag">★ ${esc(hero.score)}</span>` : ""}${total ? `<span class="tv-tag">${total} eps</span>` : ""}</div><h1>${esc(hero.title)}</h1>` +
						`<p>${esc(syn.slice(0, 220))}${syn.length > 220 ? "…" : ""}</p>` +
						`<div class="tv-actions"><button class="btn primary" type="button" id="hero-play">${icon("play")}Watch</button>` +
						`<button class="btn" type="button" id="hero-info">${icon("info")}Info</button></div></div>`;
					$("hero-play").onclick = () => play(hero.anilist_id);
					$("hero-info").onclick = () => openInfo(hero.anilist_id);
				}
				$("home-airing").innerHTML = cards(byScore.filter((a) => /RELEASING|ONGOING/.test(a.status)).slice(0, 12));
				$("home-top").innerHTML = cards(byScore.slice(0, 12));
				$("home-long").innerHTML = cards(LIB.filter((a) => (a.total_episodes || 0) > 0 && a.image && a.anilist_id)
					.slice()
					.sort((a, b) => (b.total_episodes || 0) - (a.total_episodes || 0))
					.slice(0, 12));
			}

			/* Browse (TV / Movies / Browse) with genre chips and endless scroll ---- */
			const SECTIONS = {
				tv: { title: "TV", test: (a) => a.type === "TV" },
				movie: { title: "Movies", test: (a) => a.type === "MOVIE" },
				all: { title: "Browse", test: () => true },
			};
			const PAGE = 60;
			let browse = null;
			function poolItems(b) {
				return LIB.filter((a) => b.conf.test(a) && (!b.format || a.type === b.format) && (!b.genre || a.genres.includes(b.genre)) && a.image && a.anilist_id);
			}
			function openBrowse(key) {
				const conf = SECTIONS[key];
				browse = { conf, key, format: null, genre: null, cursor: 0 };
				$("browse-title").textContent = conf.title;
				$("browse-grid").innerHTML = "";
				$("format-chips").hidden = key !== "all";
				if (key === "all") {
					const counts = {};
					for (const a of LIB) if (a.type) counts[a.type] = (counts[a.type] || 0) + 1;
					const formats = Object.entries(counts).sort((x, y) => y[1] - x[1]);
					$("format-chips").innerHTML =
						`<button class="tv-chip" type="button" data-format="" aria-pressed="true">All</button>` +
						formats.map(([f, n]) => `<button class="tv-chip" type="button" data-format="${esc(f)}" aria-pressed="false">${esc(fmtName(f))} <small>${n}</small></button>`).join("");
				}
				paintChips();
				show("browse");
				loadMore();
			}
			function paintChips() {
				const set = new Set();
				for (const a of poolItems(browse)) for (const g of a.genres) set.add(g);
				$("chips").innerHTML =
					`<button class="tv-chip" type="button" data-genre="" aria-pressed="${browse.genre == null}">All</button>` +
					[...set].sort().map((g) => `<button class="tv-chip" type="button" data-genre="${esc(g)}" aria-pressed="${browse.genre === g}">${esc(g)}</button>`).join("");
			}
			function loadMore() {
				const b = browse;
				if (!b || page !== "browse") return;
				const items = poolItems(b);
				if (!items.length) {
					$("browse-grid").innerHTML = `<p class="tv-loading">Nothing matches those filters.</p>`;
					b.cursor = 1e9; // stop the observer
					return;
				}
				const slice = items.slice(b.cursor, b.cursor + PAGE);
				$("browse-grid").insertAdjacentHTML("beforeend", cards(slice));
				b.cursor += slice.length;
			}
			$("format-chips").addEventListener("click", (e) => {
				const chip = e.target.closest("[data-format]");
				if (!chip) return;
				for (const c of $("format-chips").children) c.setAttribute("aria-pressed", c === chip);
				browse.format = chip.dataset.format || null;
				resetBrowse();
			});
			$("chips").addEventListener("click", (e) => {
				const chip = e.target.closest("[data-genre]");
				if (!chip) return;
				for (const c of $("chips").children) c.setAttribute("aria-pressed", c === chip);
				browse.genre = chip.dataset.genre || null;
				resetBrowse();
			});
			function resetBrowse() {
				browse.cursor = 0;
				$("browse-grid").innerHTML = "";
				paintChips();
				loadMore();
			}
			new IntersectionObserver((entries) => entries[0].isIntersecting && page === "browse" && loadMore(), { rootMargin: "600px" }).observe($("more"));

			$("tabs").addEventListener("click", (e) => {
				const tab = e.target.closest("[data-section]");
				if (!tab) return;
				for (const t of $("tabs").children) t.toggleAttribute("aria-current", t === tab);
				if (tab.dataset.section === "home") show("home");
				else openBrowse(tab.dataset.section);
			});

			/* Info page ----------------------------------------------------------- */
			let current = null; // { a, ep, lang, server, fromInfo }
			function openInfo(id) {
				$("info-head").innerHTML = `<p class="tv-loading">Loading…</p>`;
				$("info-head").style.backgroundImage = "";
				$("info-facts").innerHTML = "";
				$("info-eps").innerHTML = "";
				show("info");
				const a = BY_ID.get(id);
				if (!a) return show(backTo);
				expandEpisodes(a);
				const last = lastWatched(id);
				const eps = a.episodes.length;
				current = { a, ep: last.ep > 1 && last.ep <= eps ? last.ep : 1, lang: last.lang, server: last.server || null, fromInfo: true };
				if (a.banner) $("info-head").style.backgroundImage = `url("${esc(a.banner)}")`;
				$("info-head").innerHTML =
					(a.image ? `<img src="${esc(a.image)}" alt="">` : "") +
					`<div><h1>${esc(a.title)}</h1>` +
					`<div class="tv-tags">${a.genres.slice(0, 4).map((g) => `<span class="tv-tag">${esc(g)}</span>`).join("")}</div>` +
					`<p class="tv-overview" style="margin-top: 12px">${esc(a.synopsis || a.episodes[0]?.error || "")}</p>` +
					`<div class="tv-actions">${eps ? `<button class="btn primary" type="button" id="info-play">${icon("play")}${current.ep > 1 ? `Resume E${current.ep}` : "Watch"}</button>` : `<span class="tv-tag">No episodes</span>`}</div></div>`;
				if (eps) $("info-play").onclick = () => play(current.a.anilist_id, current.ep);
				$("info-facts").innerHTML = [
					["Year", a.year],
					["Rating", a.score ? `★ ${a.score}` : ""],
					["Length", eps || a.total_episodes ? `${eps || a.total_episodes} eps` : ""],
					["Status", statusLabel(a.status)],
					["Format", fmtName(a.type)],
				]
					.filter(([, v]) => v)
					.map(([l, v]) => `<div><small>${l}</small>${esc(v)}</div>`)
					.join("");
				renderEps("info-eps");
			}

			/* Episodes (shared by the info and watch pages). A 2,847-episode show would
			   lock the tab for seconds through one paint, so pills come in slabs. On the
			   watch page the slab sits around the playing episode; "Show all" repaints
			   the full list. */
			const EPS_SLAB = 120;
			function pill(n) {
				return `<button class="btn" type="button" data-ep="${n}" aria-pressed="${page === "watch" && n === current?.ep}">Episode ${n}</button>`;
			}
			const pillList = (arr) => arr.map((e) => pill(Number(e.number))).join("");
			function paintEps(box, from, to) {
				const eps = current.a.episodes;
				box.querySelector(".tv-eps").innerHTML = pillList(eps.slice(from, to));
				const more = box.querySelector("[data-more-eps]");
				if (!more) return;
				if (to >= eps.length) {
					more.remove();
					return;
				}
				more.onclick = () => {
					box.querySelector(".tv-eps").innerHTML = pillList(eps);
					more.remove();
				};
			}
			function renderEps(id) {
				const box = $(id);
				const eps = current?.a.episodes || [];
				if (!eps.length) {
					box.innerHTML = `<h2 class="tv-row-title">Episodes</h2><p class="tv-loading">No episodes available.</p>`;
					return;
				}
				const start =
					id === "watch-eps" && current.ep > EPS_SLAB ? Math.max(0, Math.min(current.ep - 10, eps.length - EPS_SLAB)) : 0;
				const to = Math.min(eps.length, start + EPS_SLAB);
				box.innerHTML = `<h2 class="tv-row-title">Episodes</h2><div class="tv-eps">Loading…</div>` +
					(eps.length > EPS_SLAB ? `<div class="tv-chips" style="margin-top: 10px"><button class="btn" type="button" data-more-eps>Show all ${eps.length}</button></div>` : "");
				paintEps(box, start, to);
			}
			for (const id of ["info-eps", "watch-eps"]) {
				$(id).addEventListener("click", (e) => {
					const ep = e.target.closest("[data-ep]");
					if (ep && current) play(current.a.anilist_id, Number(ep.dataset.ep));
				});
			}

			/* Player (provider embeds) -------------------------------------------- */
			function lastWatched(id) {
				try {
					return { ep: 1, lang: "sub", server: null, ...JSON.parse(localStorage.getItem(`flux:anime:${id}`) || "{}") };
				} catch {
					return { ep: 1, lang: "sub", server: null };
				}
			}
			function serversFor(prog, lang) {
				return buildServersFor(current.a.anilist_id, current.a.mal_id, prog).filter((s) => s.language === lang);
			}
			function play(id, ep) {
				const a = BY_ID.get(id);
				if (!a) return show(backTo);
				expandEpisodes(a);
				if (!a.episodes.length) return openInfo(id);
				if (current?.a !== a) {
					const last = lastWatched(id);
					current = { a, ep: Math.min(Math.max(1, last.ep | 0), a.episodes.length), lang: last.lang === "dub" ? "dub" : "sub", server: last.server || null, fromInfo: false };
				}
				if (ep) current.ep = ep;
				try {
					localStorage.setItem(`flux:anime:${id}`, JSON.stringify({ ep: current.ep, lang: current.lang, server: current.server }));
				} catch {
					// Resume won't be remembered.
				}
				const opts = serversFor(current.ep, current.lang);
				$("watch-title").textContent = a.title;
				if (!opts.length) {
					$("watch-ep").textContent = `Episode ${current.ep} of ${a.episodes.length} · no ${current.lang.toUpperCase()} source`;
					$("player").src = "about:blank";
					$("watch-servers").innerHTML = `<h2 class="tv-row-title">Servers</h2><p class="tv-loading">No ${esc(current.lang.toUpperCase())} source for this episode. Try the other language.</p>`;
					$("watch-eps").innerHTML = "";
					show("watch");
					guardHistory();
					return;
				}
				const s = opts.find((o) => o.serverId === current.server) || opts[0];
				current.server = s.serverId;
				$("watch-ep").textContent = `Episode ${current.ep} of ${a.episodes.length} · ${s.name} · ${current.lang.toUpperCase()}`;
				$("player").src = s.url;
				show("watch");
				guardHistory();
				paintServers(opts);
				renderEps("watch-eps");
			}
			function paintServers(opts) {
				$("watch-servers").innerHTML =
					`<h2 class="tv-row-title">Servers</h2>` +
					`<div class="tv-chips">${[["sub", "SUB"], ["dub", "DUB"]].map(([v, l]) => `<button class="tv-chip" type="button" data-lang="${v}" aria-pressed="${current.lang === v}">${l}</button>`).join("")}` +
					`<span style="width: 6px"></span>` +
					opts.map((o) => `<button class="tv-chip" type="button" data-server="${o.serverId}" aria-pressed="${o.serverId === current.server}">${esc(o.name)}</button>`).join("") +
					`</div>`;
			}
			$("watch-servers").addEventListener("click", (e) => {
				if (!current) return;
				const lang = e.target.closest("[data-lang]");
				const srv = e.target.closest("[data-server]");
				if (lang) current.lang = lang.dataset.lang;
				else if (srv) current.server = Number(srv.dataset.server);
				else return;
				play(current.a.anilist_id, current.ep);
			});

			/* The player's ads call history.back() to pull people away. Keep a spare same-page
			   history entry on top while watching, so a "back" only lands on it, then re-add it. */
			const guardHistory = () => history.state?.fluxWatch || history.pushState({ fluxWatch: true }, "");
			addEventListener("popstate", () => page === "watch" && guardHistory());

			/* Search -------------------------------------------------------------- */
			let searchTimer;
			let searchId = 0;
			$("search").addEventListener("input", (e) => {
				clearTimeout(searchTimer);
				const q = e.target.value.trim();
				if (!q) return ($("results").hidden = true);
				searchTimer = setTimeout(() => {
					const id = ++searchId;
					const ql = q.toLowerCase();
					const hits = LIB.filter((a) => a.anilist_id && a.image && a.title.toLowerCase().includes(ql)).slice(0, 8);
					if (id !== searchId) return;
					$("results").innerHTML = hits.length
						? hits
								.map((a) => `<button class="tv-result" type="button" data-id="${a.anilist_id}"><img src="${esc(a.image)}" alt=""><span><b>${esc(a.title)}</b><small>${esc(fmtName(a.type))}${a.year ? ` · ${esc(a.year)}` : ""}</small></span></button>`)
								.join("")
						: `<p class="tv-empty">No results for "${esc(q)}".</p>`;
					$("results").hidden = false;
				}, 250);
			});
			document.addEventListener("click", (e) => e.target.closest(".tv-search") || ($("results").hidden = true));
			$("search").addEventListener("keydown", (e) => e.key === "Escape" && ($("results").hidden = true));

			boot();
		</script>
	</body>
</html>
